<!DOCTYPE html>
<html>
<head>
    <title>Slideshow</title>
    <style>
        /* Include the Google Fonts stylesheet for the Noto Sans font */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Dynalight&display=swap');


/* Apply the font to the body or specific elements */
body {
  font-family: 'Noto Sans', sans-serif;
  background-color: black;
}

/* You can customize other text styles as needed */
h1, h2, h3, p {
  font-family: 'Noto Sans', sans-serif;
  /* Additional styling properties can be added here */
}

/* Example: Change the font size and color */
p {
  font-size: 16px;
  color: #333;
}

/* Example: Change the font size and color for headers */
h1 {
  font-size: 50px;
  /* color: #FF5733; */
}
h2 {
    font-size: 36px;
}

body {
    margin: 0;
    padding: 0;
    overflow: hidden;
}
.slide {
    position: relative;
    width: 100vw;
    height: 100vh;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes fadeOut {
    from {
        opacity: 1;
    }
    to {
        opacity: 0;
    }
}

.backdrop {
    position: absolute;
    top: 50%; /* Adjust this value to position the backdrop vertically */
    left: 0;
    width: 100%;
    height: auto;
    transform: translateY(-45%); /* Vertically center the backdrop */
    object-fit: cover; /* Maintain aspect ratio (typically 16:9) */
    transition: opacity 0.3s ease;
    animation: fadeIn 0.5s ease-in;
}

.slide.fade-out.backdrop {
    animation: fadeOut 0.5s ease-out forward;
}
.logo {
    position: absolute;
    bottom: 10px;
    left: 10px;
    max-height: 50%;
    max-width:30%;
    width: auto;
}
.logo::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    z-index: -1; /* Place the shadow behind the logo */
}
.featured-content {
    position: absolute;
    top: 0;
    right: 0;
    background: rgba(0, 0, 0, 0.5);
    padding: 10px;
    color: white;
    font-size: 25px;
}
.timer {
    position: absolute;
    /* display: none; */
    top: 20px;
    left: 20px; /* Move the timer to the top left */
    /* background: rgba(0, 0, 0, 0.5); */
    padding: 10px;
    color: white;
    font-size: 35px;
    border-radius: 50%;
    filter: drop-shadow(2px 2px gray);
}

.drop-shadow{
    filter:drop-shadow(5px 5px 5px black);
}

svg {
  position: absolute;
  width: 40px;
  height: 40px;
  transform: rotateY(-180deg) rotateZ(-90deg);
}

svg circle {
  stroke-dasharray: 113px;
  stroke-dashoffset: 0px;
  stroke-linecap: round;
  stroke-width: 2px;
  stroke: white;
  fill: none;
  animation: countdown 10s linear infinite forwards;
}

.paused{
    animation-play-state: paused;
}

@keyframes countdown {
  from {
    stroke-dashoffset: 0px;
  }
  to {
    stroke-dashoffset: 113px;
}
}
.clicker{
    height: 15px;
  width: 15px;
  border: 2px solid #93c47d;
  border-radius: 50%;
  display: inline-block;
}
.clicker:hover{
    cursor: pointer;
}
#navigator{
    display:flex;
    gap: 5px;
    position: absolute;
    bottom: 5px;
    right: 5px;
    /* margin-left: 0; 
    margin-right: auto; */
    padding: 8px;
    justify-content: center;
    z-index: 2; 
    background-color: rgba(24, 24, 24, 0.863);
    border-radius: 25px;
}
.play-pause-button{
    color: #93c47d;
    padding: 0px 2px;
    margin: 0px 5px;
    font-size: 1rem;
    height: 15px;
    position: relative;
    bottom: 2px;
    

}
.play-pause-button:hover{
    cursor: pointer;
}
/* add this for text inside the header */
.center-text{
    color: white;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.85);
    -webkit-filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.6));
    filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.6));
    display: inline-block;
    text-decoration: none;
    text-align: center;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: calc(100% - 40px);
    max-width: 80%;
    text-align: center;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.flex__container {
    display:flex;
}
#logo {
    width: 100px;
     /* top: 50%;
    left: 50%; */
    transform: translate(-50%, 25%);
}
.blur {
    filter:blur(5px) brightness(50%);
}
.jojo-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: calc(100% - 40px);
    max-width: 80%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 999;
}
.jojo-title {
    margin: 0;
    font-family: Dynalight;
    font-size: 5em;
    color: #ff7700;
    font-weight: bold;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.85);
}
.jojo-countdown {
    /* margin-top: 8px; */
    font-family: Dynalight;
    font-size: 7em;
    letter-spacing: 1px;
    color: white;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.85);
}
.play-pause-button svg {
    position: static;
    width: 15px;
    height: 15px;
    transform: none;
    vertical-align: middle;
}

    </style>
</head>
<body>

<script>
    let paused = false;
    // function to generate the navigator
    function generateNavigator(array) {
        let string = "";
        string += '<span class="play-pause-button" role="button" aria-label="Pause">'
        string += '<svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="3" width="5" height="18"></rect><rect x="15" y="3" width="5" height="18"></rect></svg>'
        string += '<svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" style="display:none"><polygon points="5,3 20,12 5,21"></polygon></svg>'
        string += '</span>'
        for (let i = 0; i < array.length; i++) {
            string += '<span class="clicker" data-slide="'
            string += i
            string += '" ref="target"> </span>'
            string += " "
        }
        document.querySelector("#navigator").innerHTML = string
    }
    // Function to shuffle an array
    // function shuffleArray(array) {
    //     for (let i = array.length - 1; i > 0; i--) {
    //         const j = Math.floor(Math.random() * (i + 1));
    //         [array[i], array[j]] = [array[j], array[i]];
    //     }

    //     return array;
    // }

    var slides = document.querySelectorAll(".slide");
    
    let slidesArr = Array.from({ length: slides.length }, (_, i) => i);
    generateNavigator(slides);
    var clickers = document.querySelectorAll(".clicker");

    const circles = document.getElementsByClassName("circle");
    
    // load event listeners to clickers
    for (var i = 0; i < clickers.length; i++){
        clickers[i].addEventListener('click', myFunction, false)
    }
    
    var currentSlide = 0;
    function myFunction(){
        let slide = this.getAttribute("data-slide");
        if(paused){
            playPause()
        }
        currentSlide = parseInt(slide);
        showSlide(currentSlide);
    }

    const playPauseButton = document.querySelector(".play-pause-button");
    const iconPause = playPauseButton.querySelector(".icon-pause");
    const iconPlay = playPauseButton.querySelector(".icon-play");

    function playPause(){
        if(!paused){
            paused = true;
            iconPause.style.display = "none";
            iconPlay.style.display = "inline-block";
            playPauseButton.setAttribute("aria-label", "Play");
        }
        else{
            paused = false;
            iconPlay.style.display = "none";
            iconPause.style.display = "inline-block";
            playPauseButton.setAttribute("aria-label", "Pause");
        }
        // the timer circle is optional per slide
        if(circles[currentSlide]){
            circles[currentSlide].classList.toggle("paused", paused);
        }
    }
    playPauseButton.addEventListener('click', playPause, false);

    // generateNavigator(slidesArr);
    // document.querySelector("#navigator").innerHTML = generateNavigator(slidesArr)
    // var shuffledIndexes = shuffleArray(slidesArr);

    function showSlide(index) {
        for (var i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
            clickers[i].style.backgroundColor = "#2b2b2b"
        }
        slides[index].style.display = "block";
        clickers[index].style.backgroundColor = "#f5f5f5"
        countdown = 10; // Reset countdown for each slide
        // updateClickers(index);
    }

    // function updateClicker(index){
        
    // }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
    }


    showSlide(currentSlide);
    

    
    // Initial call for the first slide
    var countdown = 10;
    var timer = document.querySelector(".timer");
    // timer.innerHTML = countdown;

    function updateTimer() {
        if(!paused){
            countdown--;
        }
        // timer.innerHTML = countdown;
        if (countdown <= 0 && !paused) {
            nextSlide();
        }
    }

    // Timer for slide transition
    setInterval(updateTimer, 1000);

    // Countdown to the upcoming Friday at midnight
    function getNextFriday() {
        const target = new Date();
        target.setHours(0, 0, 0, 0);
        let days = (5 - target.getDay() + 7) % 7;
        if (days === 0) {
            days = 7;
        }
        target.setDate(target.getDate() + days);
        return target;
    }

    var nextFriday = getNextFriday();
    var countdownEl = document.querySelector("#jojo-countdown");

    function pad(n) {
        return String(n).padStart(2, "0");
    }

    function updateCountdown() {
        if (!countdownEl) {
            return;
        }
        var remaining = nextFriday - Date.now();
        if (remaining <= 0) {
            nextFriday = getNextFriday();
            remaining = nextFriday - Date.now();
        }
        var days = Math.floor(remaining / 86400000);
        var hours = Math.floor(remaining / 3600000) % 24;
        var minutes = Math.floor(remaining / 60000) % 60;
        var seconds = Math.floor(remaining / 1000) % 60;
        countdownEl.textContent = days + ":" + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
